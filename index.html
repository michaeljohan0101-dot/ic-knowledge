<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IC 协作知识库 | Community Hub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #06b6d4;
            --bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
        }

        header { padding: 4rem 1rem 2rem; text-align: center; }
        header h1 { font-size: 3.2rem; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1.5px; }
        header p { color: var(--text-muted); font-size: 1.1rem; margin-top: 10px; }

        .toolbar { position: sticky; top: 20px; z-index: 100; max-width: 900px; margin: 0 auto 2rem; background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 0.8rem; border-radius: var(--radius-lg); border: 1px solid rgba(255, 255, 255, 0.4); display: flex; justify-content: center; gap: 12px; box-shadow: var(--shadow-lg); }
        .toolbar button { background: white; color: var(--text-main); border: 1px solid var(--border); padding: 10px 20px; border-radius: var(--radius-md); cursor: pointer; font-weight: 700; font-size: 0.85rem; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .toolbar button:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-color: var(--primary); }
        .toolbar button.primary { background: var(--primary); color: white; border: none; }

        .sync-badge { position: fixed; top: 20px; right: 20px; padding: 6px 15px; border-radius: 100px; font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; gap: 6px; z-index: 1000; box-shadow: var(--shadow-lg); }
        .sync-badge.online { background: #dcfce7; color: #16a34a; }
        .sync-badge.offline { background: #fee2e2; color: #ef4444; }

        .search-container { max-width: 600px; margin: 0 auto 3rem; }
        .search-box { display: flex; background: white; border-radius: 100px; padding: 7px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .search-box input { flex: 1; padding: 10px 25px; border: none; outline: none; font-size: 1rem; }
        .search-box button { background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; }

        nav ul { display: flex; justify-content: center; list-style: none; gap: 10px; margin-bottom: 3rem; flex-wrap: wrap; }
        nav button { background: transparent; border: none; color: var(--text-muted); padding: 10px 20px; border-radius: 100px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        nav button.active { background: white; color: var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        main { max-width: 1300px; margin: 0 auto; padding: 0 2rem 5rem; }
        .knowledge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 30px; }
        .knowledge-card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 35px; border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 4px 20px rgba(0,0,0,0.03); cursor: pointer; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; position: relative; }
        .knowledge-card:hover { transform: translateY(-12px); box-shadow: 0 30px 60px rgba(0,0,0,0.1); border-color: var(--primary); }
        .knowledge-card h3 { font-size: 1.6rem; font-weight: 800; margin-bottom: 1.2rem; line-height: 1.2; }
        .knowledge-card p { color: var(--text-muted); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 1.5rem; border-top: 1px solid #f1f5f9; }
        .author-tag { font-size: 0.75rem; font-weight: 700; color: var(--primary); background: rgba(79, 70, 229, 0.08); padding: 4px 12px; border-radius: 100px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal { background: white; border-radius: 35px; padding: 45px; width: 100%; max-width: 900px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.2); position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; }
        .modal-close { background: #f1f5f9; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.6rem; font-weight: 700; color: var(--text-muted); font-size: 0.85rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 15px 22px; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 1rem; background: #f8fafc; transition: 0.3s; }
        .form-group textarea { min-height: 300px; line-height: 1.8; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .btn-group { display: flex; justify-content: flex-end; gap: 12px; margin-top: 3rem; }
        .btn { padding: 14px 30px; border-radius: 100px; font-weight: 800; cursor: pointer; border: none; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: #f1f5f9; color: var(--text-muted); }
        .btn-danger { background: #fee2e2; color: #ef4444; }

        .read-content { font-size: 1.2rem; line-height: 1.9; color: #334155; white-space: pre-wrap; }
        .read-content img { max-width: 100%; border-radius: var(--radius-md); margin: 2rem 0; box-shadow: var(--shadow-lg); }

        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: #0f172a; color: white; padding: 15px 35px; border-radius: 100px; font-weight: 700; z-index: 2000; display: none; box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { transform: translate(-50%, 40px); opacity: 0; } }
    </style>
</head>
<body>
    <div id="syncBadge" class="sync-badge offline">● 离线模式</div>

    <header>
        <h1>🔌 IC Community Hub</h1>
        <p>全球集成电路知识共享库 · 实时云同步已开启</p>
    </header>

    <div class="toolbar">
        <button class="primary" onclick="openEditModal(-1)"><span>➕</span> 发布新知识</button>
        <button onclick="openSyncModal()"><span>⚙️</span> 协作设置</button>
        <button onclick="fetchCloud()"><span>🔄</span> 刷新云端</button>
        <button onclick="exportData()"><span>📤</span> 导出备份</button>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索全库知识点..." onkeyup="if(event.key==='Enter')search()">
            <button onclick="search()">🔍</button>
        </div>
    </div>

    <nav><ul id="navLinks"></ul></nav>

    <main id="mainContent"></main>

    <!-- 设置模态框 -->
    <div class="modal-overlay" id="syncModal">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header"><h2>⚙️ 协作设置</h2><button class="modal-close" onclick="closeM('syncModal')">&times;</button></div>
            <div class="form-group"><label>你的社区昵称</label><input type="text" id="syncUser" placeholder="例如: Michael"></div>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-top:20px;">* 已集成你的 Supabase 私人连接，无需再次填写 URL。</p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveConfig()">保存设置</button>
            </div>
        </div>
    </div>

    <!-- 编辑模态框 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <div class="modal-header"><h2 id="modalTitle">发布新知识</h2><button class="modal-close" onclick="closeM('editModal')">&times;</button></div>
            <form onsubmit="save(event)">
                <input type="hidden" id="editIndex">
                <div style="display:grid; grid-template-columns: 1fr 2fr; gap:25px;">
                    <div class="form-group"><label>分类</label><select id="editCat"></select></div>
                    <div class="form-group"><label>标题</label><input type="text" id="editTitle" required placeholder="输入标题..."></div>
                </div>
                <div class="form-group"><label>内容 (支持直接粘贴图片 Ctrl+V)</label><textarea id="editContent" required onpaste="handlePaste(event)" placeholder="分享你的发现..."></textarea></div>
                <div id="imgPreview" style="display:flex; gap:10px; margin-bottom:1.5rem; flex-wrap:wrap;"></div>
                <div class="btn-group">
                    <button type="button" class="btn btn-danger" id="delBtn" onclick="del()">撤回发布</button>
                    <button type="button" class="btn btn-ghost" onclick="closeM('editModal')">取消</button>
                    <button type="submit" class="btn btn-primary">立即发布到社区</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 阅读模态框 -->
    <div class="modal-overlay" id="readModal">
        <div class="modal"><button class="modal-close" onclick="closeM('readModal')" style="position:absolute; top:40px; right:40px;">&times;</button><h2 id="readTitle" style="font-size:2.5rem; margin-bottom:2rem;"></h2><div id="readBody" class="read-content"></div><div class="btn-group"><button class="btn btn-ghost" onclick="closeM('readModal')">完成阅读</button><button class="btn btn-primary" id="editBtnRead">✏️ 编辑此条</button></div></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // 核心配置 (已集成用户提供的 Key)
        const SB_URL = "https://hwkvbbrdvlnzwpwovyyi.supabase.co";
        const SB_KEY = "sb_publishable_PR7jsN2qZiZUGOd8SXf3BA_zYJrVz_E";
        
        let categories = [{id:'basics', name:'基础概念'}, {id:'design', name:'设计流程'}, {id:'manufacturing', name:'制造工艺'}, {id:'packaging', name:'封装测试'}];
        let knowledgeData = [];
        let currentCat = 'all';
        let tempImages = [];
        let supabase = null;
        let currentUser = localStorage.getItem('ic_nickname') || "探索者";

        function init() {
            document.getElementById('syncUser').value = currentUser;
            try {
                supabase = window.supabase.createClient(SB_URL, SB_KEY);
                document.getElementById('syncBadge').className = "sync-badge online";
                document.getElementById('syncBadge').textContent = "● 社区协作模式";
            } catch(e) { console.error("Cloud init fail"); }
            
            updateCatSelect();
            fetchCloud();
        }

        async function fetchCloud() {
            if(!supabase) return;
            toast("🔄 正在同步社区最新知识...");
            const { data, error } = await supabase.from('knowledge').select('*').order('updated_at', { ascending: false });
            if(!error && data) {
                knowledgeData = data;
                renderNav();
                renderGrid();
            } else { toast("❌ 同步失败，请检查数据库设置"); }
        }

        function renderNav() {
            const nav = document.getElementById('navLinks');
            let html = `<li><button class="${currentCat==='all'?'active':''}" onclick="setCat('all')">全库</button></li>`;
            categories.forEach(c => { html += `<li><button class="${currentCat===c.id?'active':''}" onclick="setCat('${c.id}')">${c.name}</button></li>`; });
            nav.innerHTML = html;
        }

        function setCat(id) { currentCat = id; renderNav(); renderGrid(); }

        function renderGrid() {
            const grid = document.getElementById('mainContent');
            const filtered = currentCat === 'all' ? knowledgeData : knowledgeData.filter(d => d.category === currentCat);
            let html = `<div class="knowledge-grid">`;
            filtered.forEach(item => {
                const idx = knowledgeData.indexOf(item);
                html += `
                <div class="knowledge-card" onclick="openRead(${idx})">
                    <h3>${item.title}</h3>
                    <p>${item.content.replace(/\[\[图片\d+\]\]/g, '[图]')}</p>
                    <div class="card-footer">
                        <span class="author-tag">👤 ${item.author || '匿名'}</span>
                        <span style="font-size:0.7rem; color:#94a3b8;">${new Date(item.updated_at).toLocaleDateString()}</span>
                    </div>
                </div>`;
            });
            html += `<div class="add-card" onclick="openEditModal(-1)"><span>➕</span><strong>发布我的发现</strong></div></div>`;
            grid.innerHTML = html;
        }

        function openRead(idx) {
            const item = knowledgeData[idx];
            document.getElementById('readTitle').textContent = item.title;
            let bodyHtml = item.content;
            if(item.images) { item.images.forEach((img, i) => { bodyHtml = bodyHtml.split(`[[图片${i+1}]]`).join(`<img src="${img}">`); }); }
            document.getElementById('readBody').innerHTML = bodyHtml;
            document.getElementById('editBtnRead').onclick = () => { closeM('readModal'); openEditModal(idx); };
            document.getElementById('readModal').classList.add('active');
        }

        function openEditModal(idx) {
            const isEdit = idx >= 0;
            const item = isEdit ? knowledgeData[idx] : { category: categories[0].id, title: '', content: '', images: [] };
            document.getElementById('editIndex').value = idx;
            document.getElementById('editCat').value = item.category;
            document.getElementById('editTitle').value = item.title;
            document.getElementById('editContent').value = item.content;
            tempImages = item.images || [];
            renderTempImages();
            document.getElementById('delBtn').style.display = isEdit ? 'block' : 'none';
            document.getElementById('editModal').classList.add('active');
        }

        function handlePaste(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) { if (item.type.indexOf('image') !== -1) { 
                const reader = new FileReader(); 
                reader.onload = (ev) => { 
                    tempImages.push(ev.target.result); 
                    renderTempImages(); 
                    document.getElementById('editContent').value += `\n[[图片${tempImages.length}]]\n`; 
                }; 
                reader.readAsDataURL(item.getAsFile()); 
            } }
        }

        function renderTempImages() { document.getElementById('imgPreview').innerHTML = tempImages.map((img, i) => `<img src="${img}" style="width:50px;height:50px;object-fit:cover;border-radius:8px;border:2px solid white;box-shadow:0 2px 5px rgba(0,0,0,0.1);">`).join(''); }

        async function save(e) {
            e.preventDefault();
            const idx = parseInt(document.getElementById('editIndex').value);
            const data = {
                id: idx >= 0 ? knowledgeData[idx].id : Math.random().toString(36).substr(2, 9),
                category: document.getElementById('editCat').value,
                title: document.getElementById('editTitle').value,
                content: document.getElementById('editContent').value,
                images: [...tempImages],
                author: currentUser,
                updated_at: new Date()
            };
            
            toast("🚀 正在发布到云端...");
            const { error } = await supabase.from('knowledge').upsert(data);
            if(!error) {
                closeM('editModal');
                fetchCloud();
                toast("✨ 发布成功！全社区已同步");
            } else { toast("❌ 发布失败，请检查 SQL 表是否创建"); }
        }

        async function del() {
            if(!confirm('确定撤回这条发布吗？')) return;
            const idx = document.getElementById('editIndex').value;
            const { error } = await supabase.from('knowledge').delete().eq('id', knowledgeData[idx].id);
            if(!error) { closeM('editModal'); fetchCloud(); toast("🗑️ 已从社区撤回"); }
        }

        function saveConfig() {
            currentUser = document.getElementById('syncUser').value.trim() || "探索者";
            localStorage.setItem('ic_nickname', currentUser);
            closeM('syncModal');
            toast("✅ 设置已保存");
            renderGrid();
        }

        function updateCatSelect() { document.getElementById('editCat').innerHTML = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join(''); }
        function closeM(id) { document.getElementById(id).classList.remove('active'); }
        function openSyncModal() { document.getElementById('syncModal').classList.add('active'); }
        function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        
        function exportData() {
            const blob = new Blob([JSON.stringify(knowledgeData, null, 2)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ic_community_backup.json`; a.click();
        }

        init();
    </script>
</body>
</html>
